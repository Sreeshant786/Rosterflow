version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rosterflow_postgres
    restart: always
    environment:
      POSTGRES_USER: rosterflow
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: rosterflow_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rosterflow_backend
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://rosterflow:secretpassword@db:5432/rosterflow_db
      - PROJECT_NAME=RosterFlow
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rosterflow_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
